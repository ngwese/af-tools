version = "0.1.0"
authors = [ "Greg Wuller <greg@afofo.com>" ]
edition = "2018"
license = "MIT"

[lib]
name = "af_path"
crate-type = ["cdylib"]

[dependencies]
median = { git = "https://github.com/Cycling74/median" }
